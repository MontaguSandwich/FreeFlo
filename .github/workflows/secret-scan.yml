name: secret-scan
# First codified detector from the 2026-07-06 security audit.
# Catches the leak class that hid the live witness key: a tracked non-example .env
# and any *_PRIVATE_KEY = <64-hex> pattern (whitespace-tolerant), tuned via .gitleaks.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run FreeFlo secret guard
        run: bash scripts/ci/check-secrets.sh
