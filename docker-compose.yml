# FreeFlo backend — solver + attestation on one host. See deploy/DEPLOY.md.
#
# The frontend (Vercel) reaches the solver SERVER-SIDE over plain HTTP, so no TLS/reverse-proxy is
# needed here; the solver's /api/compact/fill is protected by COMPACT_FILL_API_KEY (Phase 1). The
# attestation service holds the witness key and is NOT published to the host — only the solver
# reaches it over the internal compose network.

services:
  attestation-service:
    build:
      context: ./attestation
    image: freeflo-attestation
    container_name: freeflo-attestation
    restart: unless-stopped
    env_file:
      - ./deploy/attestation.env
    expose:
      - "4001"            # internal only (no host port published)
    networks: [freeflo]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  solver:
    build:
      context: .
      dockerfile: solver/Dockerfile
    image: freeflo-solver
    container_name: freeflo-solver
    restart: unless-stopped
    # The solver loads ENV_FILE via dotenv (override:true). We bind-mount the real env file
    # read-write so rotating Qonto OAuth tokens (written back to ENV_FILE) survive restarts.
    environment:
      - ENV_FILE=/app/solver.env
    volumes:
      - ./deploy/solver.env:/app/solver.env
      - solver-data:/app/data
    ports:
      - "8080:8080"       # health
      - "8081:8081"       # quote + compact-fill API (Vercel SOLVER_API_URL points here)
    depends_on:
      attestation-service:
        condition: service_healthy
    networks: [freeflo]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  solver-data:

networks:
  freeflo:
    driver: bridge
